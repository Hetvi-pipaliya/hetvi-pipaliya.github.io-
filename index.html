<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #151D30;
            --accent: #3B82F6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Ambient Background Light */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            z-index: 0;
            pointer-events: none;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 10%;
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        header {
            min-height: 100vh;
            padding: 0 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .tag {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            width: fit-content;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4rem;
            font-weight: 700;

        }

        .hero-desc {

            color: var(--text-secondary);

            margin-bottom: 2.5rem;

        .cta-group {

            gap: 1.5rem;
        }

            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-secondary:hover {

            border-color: var(--text-secondary);
        }

            z-index: 1;
            border-top: 1px solid var(--border-color);

            font-size: 2.2rem;

            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title span {

            font-size: 1.2rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* About Grid Layout */
        .about-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        .about-text {

            color: var(--text-secondary);
        }

        .about-text p {
            margin-bottom: 1.5rem;
        }

            padding: 2.5rem 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;

            border-color: rgba(59, 130, 246, 0.3);

            font-weight: 700;
            margin-bottom: 1rem;
            display: block;
        }

        .skill-card h3 {

            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .skill-list {

            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* Projects Section Architecture */

            display: flex;
            flex-direction: column;
            transition: all 0.3s;

            border-color: rgba(59, 130, 246, 0.3);
        }

        .project-content {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .project-content h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .project-content p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .tech-tags span {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .project-link {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }

        .project-link:hover {
            color: var(--accent);
        }

        .certs-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
        }

        .cert-item {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cert-info h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            margin-bottom: 0.4rem;
        }

        .cert-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .cert-date {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            background: var(--accent-glow);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
        }

        footer {
            padding: 5rem 10%;
            background: #080B12;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
